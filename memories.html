<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="images/icon.png" />
  <link rel="apple-touch-icon" href="images/icon.png" />
  <title>Little Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" class="logo">for Simran ♡</a>
    <button class="menu-btn" aria-label="Menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="reasons.html">Reasons</a></li>
      <li><a href="memories.html">Memories</a></li>
      <li><a href="openwhen.html">Open When</a></li>
      <li><a href="smile.html">Smile Zone</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="gifts.html">Gifts</a></li>
      <li><a href="letter.html">A Letter</a></li>
    </ul>
  </nav>

  <main>
    <div class="page-title">
      <h1>Little memories</h1>
      <p>Moments that made life a bit brighter. Tap any photo to see it big.</p>
    </div>
    <div class="story-btn"><button class="btn" id="playStory">Play the Simran show ✨</button></div>
    <div class="gallery" id="gallery"></div>

    <div class="next-link"><a href="openwhen.html" class="btn">Next: Open When ✉️</a></div>
  </main>

  <footer>more memories loading… 🌷</footer>

  <div class="lightbox" id="lightbox">
    <button class="close-x lb-close" aria-label="Close">✕</button>
    <button class="lb-nav lb-prev" aria-label="Previous">‹</button>
    <img id="lb-img" alt="" />
    <p id="lb-cap"></p>
    <p class="lb-count" id="lb-count"></p>
    <button class="lb-nav lb-next" aria-label="Next">›</button>
  </div>

  <script src="main.js"></script>
  <script>
    // ✏️ Put photos in the images/ folder and list them here with a caption.
    // Any file that's missing shows a cute placeholder instead.
    const photos = [
      ["images/photo16.jpg", "where it all started: tiny birthday girl in a party hat 🎂"],
      ["images/photo17.jpg", "garden vibes & that side smile 🌿"],
      ["images/photo2.jpg", "sunshine in a yellow hoodie 🌼"],
      ["images/photo8.jpg", "saree day = slay day 💙"],
      ["images/photo3.jpg", "flowers in her hair 🌸"],
      ["images/photo9.jpg", "red looks unfair on you ❤️"],
      ["images/photo5.jpg", "making wishes with lanterns 🏮"],
      ["images/photo6.jpg", "blooming, just like the flowers 🌺"],
      ["images/photo7.jpg", "even as a sketch, you're art ✏️"],
      ["images/photo12.jpg", "under the fairy lights ✨"],
      ["images/photo1.jpg", "mirror selfie queen 🤳"],
      ["images/photo4.jpg", "night lights & quiet thoughts 🌙"],
      ["images/photo11.jpg", "main character energy 🎬"],
      ["images/photo10.jpg", "elevator selfie but make it iconic 🖤"],
      ["images/photo14.jpg", "lost in twinkle lights 🌳"],
      ["images/photo13.jpg", "city nights 🌃"],
      ["images/photo15.jpg", "dressed up & glowing 💫"]
    ];

    const gallery = document.getElementById("gallery");
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    const good = []; // photos that loaded, in order
    let cur = 0, timer = null;

    photos.forEach(([src, caption]) => {
      const fig = document.createElement("figure");
      fig.className = "polaroid";
      const img = new Image();
      img.src = src;
      img.alt = caption;
      img.onerror = () => {
        img.replaceWith(Object.assign(document.createElement("div"), {
          className: "ph",
          innerHTML: `<div><b>📷</b>add ${src}</div>`
        }));
        fig.style.cursor = "default";
        fig.dataset.empty = 1;
        const k = good.findIndex((g) => g[0] === src);
        if (k > -1) good.splice(k, 1);
      };
      good.push([src, caption]);
      fig.appendChild(img);
      const cap = document.createElement("figcaption");
      cap.textContent = caption;
      fig.appendChild(cap);
      fig.addEventListener("click", () => {
        if (fig.dataset.empty) return;
        open(good.findIndex((g) => g[0] === src), false);
      });
      gallery.appendChild(fig);
    });

    function showPhoto(k, story) {
      cur = (k + good.length) % good.length;
      const [src, caption] = good[cur];
      lbImg.src = src;
      lbImg.classList.remove("kb", "fadein"); void lbImg.offsetWidth;
      lbImg.classList.add(story ? "kb" : "fadein");
      document.getElementById("lb-cap").textContent = caption;
      document.getElementById("lb-count").textContent = `${cur + 1} / ${good.length}`;
    }
    function open(k, story) {
      if (!good.length) return;
      lb.classList.add("open");
      showPhoto(k, story);
      clearInterval(timer);
      if (story) {
        timer = setInterval(() => {
          if (cur === good.length - 1) { close(); heartRain(3000); return; }
          showPhoto(cur + 1, true);
        }, 4500);
      }
    }
    function close() { lb.classList.remove("open"); clearInterval(timer); }
    function step(d) { clearInterval(timer); showPhoto(cur + d, false); }

    document.getElementById("playStory").addEventListener("click", () => open(0, true));
    lb.querySelector(".lb-prev").addEventListener("click", (e) => { e.stopPropagation(); step(-1); });
    lb.querySelector(".lb-next").addEventListener("click", (e) => { e.stopPropagation(); step(1); });
    lb.addEventListener("click", (e) => { if (e.target === lb || e.target.closest(".lb-close")) close(); });
    lbImg.addEventListener("click", (e) => { e.stopPropagation(); step(1); });
    document.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowRight") step(1);
      if (e.key === "ArrowLeft") step(-1);
    });
    // Swipe on phones
    let sx = null;
    lb.addEventListener("touchstart", (e) => (sx = e.touches[0].clientX), { passive: true });
    lb.addEventListener("touchend", (e) => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
      sx = null;
    });
  </script>
</body>
</html>
