<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="images/icon.png" />
  <link rel="apple-touch-icon" href="images/icon.png" />
  <title>Open When Letters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" class="logo">for Simran ♡</a>
    <button class="menu-btn" aria-label="Menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="reasons.html">Reasons</a></li>
      <li><a href="memories.html">Memories</a></li>
      <li><a href="openwhen.html">Open When</a></li>
      <li><a href="smile.html">Smile Zone</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="gifts.html">Gifts</a></li>
      <li><a href="letter.html">A Letter</a></li>
    </ul>
  </nav>

  <main>
    <div class="page-title">
      <h1>Open when…</h1>
      <p>Little letters for different kinds of days. Open the one you need, whenever you need it.</p>
    </div>
    <div class="env-grid" id="envs"></div>

    <div class="next-link"><a href="smile.html" class="btn">Next: Smile Zone 😄</a></div>
  </main>

  <footer>come back to these any time ♡</footer>

  <div class="modal" id="modal">
    <div class="letter-paper">
      <button class="close-x" id="close" aria-label="Close">×</button>
      <h2 id="m-title"></h2>
      <div id="m-body"></div>
    </div>
  </div>

  <div id="sit" aria-hidden="true">
    <div class="sit-heart">🤍</div>
    <p class="sit-line" id="sitLine"></p>
    <div class="sit-btns">
      <a class="btn" id="sitText" target="_blank" rel="noopener">Text me 💬</a>
      <button class="btn ghost" id="sitDone">I'm okay now 🌷</button>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // ✏️ Edit these letters — your own words will mean the most.
    const letters = [
      {
        label: "you want to be alone",
        title: "You don't have to face it alone 🤍",
        body: [
          "I know how it gets when you're by yourself. It goes quiet outside, and then everything comes back. Every person who ever cried in front of you, every heavy moment you held for someone else. All of it, at once.",
          "And you've always handled it the same way. Alone. Quietly. Until you're calm again. You're so strong for that. But you shouldn't have to be strong alone every single time.",
          "I'm not asking you to stop needing your space. Take it. It's yours. I just want you to know that alone doesn't have to mean lonely anymore.",
          "I might not be able to fix it. I might not even know the right thing to say. But I can sit next to you. I can stay quiet with you. I can hold your hand while it passes.",
          "Whatever comes up in your head, we'll face it together. You and me. Always. 🫂",
          "So next time it gets loud in there, just send me one word. You don't have to explain anything. I'll be there."
        ],
        sitWa: "hey… it's getting loud in my head. stay with me? 🤍",
        sit: true
      },
      {
        label: "you think I'm going out of my way",
        title: "It's not out of my way 🏍️",
        body: [
          "I know you keep saying \"tum mat aao, ulta route hai\". And I know you say it because you care. That's honestly really sweet.",
          "But here's the thing: that \"wrong route\" is my favourite part of the day. You sitting behind me, the wind, the random talks, even the traffic I secretly don't mind.",
          "So next time, don't cancel on me. Just text \"pick me up\" and let me be happy. 🙂"
        ],
        wa: "Okay fine… pick me up? 🏍️"
      },
      {
        label: "you're upset with me",
        title: "I'm sorry 🤍",
        body: [
          "If you're opening this, I probably messed up. And I'm sorry.",
          "You don't have to pretend it's okay, and you don't have to forgive me right away. You're allowed to be upset.",
          "I'll listen properly this time. No overreacting, no making it about me. Just tell me what I got wrong, whenever you're ready."
        ],
        wa: "hey, I'm a bit upset with you 😕"
      },
      {
        label: "you feel sad",
        title: "Hey, it's okay 🤍",
        body: [
          "It's okay to feel sad. You don't have to pretend to be fine all the time.",
          "Cry if you need to, eat something nice, wrap yourself in a blanket. Feelings are like weather — this one will pass too.",
          "And just so you know: you're not alone in this. Not even a little bit."
        ],
        wa: "hey, not having a great day today 😔"
      },
      {
        label: "you can't sleep",
        title: "Late night thoughts 🌙",
        body: [
          "Overthinking at 2am again? Put the phone a bit away from your face (after reading this, obviously).",
          "Let's breathe together for a minute. Follow the circle: in as it grows, hold, out as it shrinks.",
          "Tomorrow is a fresh page. You don't have to figure out everything tonight. Sleep well, Simran. 🌙"
        ],
        breathe: true
      },
      {
        label: "you need a laugh",
        title: "Emergency laugh delivery 😂",
        body: [
          "Why did the scarecrow win an award? Because he was outstanding in his field. 🌾",
          "Okay okay, that was bad. But you smiled a little, right? Mission accomplished.",
          "Also, go to the Smile Zone page. There's more where that came from. Unfortunately for you."
        ]
      },
      {
        label: "you feel alone",
        title: "You're not alone 🫂",
        body: [
          "It might feel that way sometimes, but there are people who really care about you. I'm one of them.",
          "Text someone. Call a friend. Or just text me — even if it's just a random emoji.",
          "You matter more than you know."
        ],
        wa: "hey… feeling a bit alone right now 🥺"
      },
      {
        label: "you doubt yourself",
        title: "Read this twice 💪",
        body: [
          "You are enough. Exactly as you are. Not 'when you fix this' or 'after you change that'. Now.",
          "Someone else not seeing your worth doesn't reduce it even by 1%.",
          "You've gotten through every hard day so far. That's a 100% success rate."
        ]
      },
      {
        label: "you need motivation",
        title: "Main character time ✨",
        body: [
          "This is the part of the movie where she gets her glow back. 💅",
          "Drink some water, put on your favourite song, and do one small thing for yourself today.",
          "New chapter, new you. And honestly? It's going to be a good one."
        ]
      },
      {
        label: "you miss the old days",
        title: "About the past 🍂",
        body: [
          "It's normal to miss things, even things that weren't right for you.",
          "Be gentle with yourself. Healing isn't a straight line — some days will be better than others.",
          "The best days aren't behind you. A lot of them haven't even happened yet."
        ]
      },
      {
        label: "you're happy",
        title: "YAY 🎉",
        body: [
          "Look at you! This makes me so happy.",
          "Remember this feeling. Screenshot it mentally. This is what you deserve every day.",
          "Now go do something fun. You earned it. 💗"
        ]
      }
    ];

    const wrap = document.getElementById("envs");
    const modal = document.getElementById("modal");
    // Breathing circle: grows 4s (in), holds 4s, shrinks 6s (out), on repeat.
    let breatheTimer;
    function startBreathing(root) {
      const circle = root.querySelector(".breathe-circle");
      const text = root.querySelector(".breathe-text");
      const steps = [["breathe in…", 4, 1], ["hold…", 4, 1], ["breathe out…", 6, 0.45]];
      let i = 0;
      const run = () => {
        const [label, secs, scale] = steps[i];
        text.textContent = label;
        circle.style.transitionDuration = secs + "s";
        circle.style.transform = `scale(${scale})`;
        i = (i + 1) % steps.length;
        breatheTimer = setTimeout(run, secs * 1000);
      };
      setTimeout(run, 50);
    }

    letters.forEach((l) => {
      const env = document.createElement("div");
      env.className = "envelope";
      env.innerHTML = `<div class="seal">💌</div><span>open when ${l.label}</span>`;
      env.addEventListener("click", () => {
        clearTimeout(breatheTimer);
        document.getElementById("m-title").textContent = l.title;
        const body = document.getElementById("m-body");
        const paras = l.body.map((p) => `<p>${p}</p>`);
        if (l.breathe) paras.splice(2, 0, `<div class="breathe"><div class="breathe-circle"></div><p class="breathe-text">get comfy…</p></div>`);
        body.innerHTML = paras.join("");
        const url = l.wa && waLink(l.wa);
        if (url) body.insertAdjacentHTML("beforeend", `<p class="wa-wrap"><a class="btn" target="_blank" rel="noopener" href="${url}">Text me 💬</a></p>`);
        if (l.breathe) startBreathing(body);
        if (l.sit) {
          body.insertAdjacentHTML("beforeend", `<p class="wa-wrap"><button class="btn" id="sitBtn">Sit with me for a bit 🤍</button></p>`);
          body.querySelector("#sitBtn").addEventListener("click", () => startSit(l.sitWa));
        }
        modal.classList.add("open");
        env.classList.add("read");
      });
      wrap.appendChild(env);
    });
    // ✏️ "Sit with me": quiet screen, one soft line at a time.
    const SIT_LINES = [
      "Hey. I'm right here.",
      "You don't have to say anything.",
      "Just breathe. Slowly. With the heart.",
      "Whatever you're hearing right now, it's not happening anymore.",
      "You're safe. You're here. With me.",
      "You held everyone else's tears. Let me hold you for a bit.",
      "Take all the time you need. I'm not going anywhere.",
      "Still here. 🤍"
    ];
    const sit = document.getElementById("sit");
    let sitTimer;
    function startSit(waText) {
      close();
      const t = document.getElementById("sitText");
      const url = waText && waLink(waText);
      if (url) { t.href = url; t.style.display = ""; } else t.style.display = "none";
      let k = 0;
      const line = document.getElementById("sitLine");
      const next = () => {
        line.classList.remove("show");
        setTimeout(() => {
          line.textContent = SIT_LINES[k];
          line.classList.add("show");
          k = k < SIT_LINES.length - 1 ? k + 1 : 4; // after the last one, keep gently looping
          sitTimer = setTimeout(next, 6000);
        }, 900);
      };
      sit.classList.add("open");
      next();
    }
    document.getElementById("sitDone").addEventListener("click", () => {
      clearTimeout(sitTimer);
      const line = document.getElementById("sitLine");
      line.classList.remove("show");
      setTimeout(() => {
        line.textContent = "Proud of you. You didn't face it alone this time. 🌷";
        line.classList.add("show");
        setTimeout(() => sit.classList.remove("open"), 3500);
      }, 900);
    });

    const close = () => { modal.classList.remove("open"); clearTimeout(breatheTimer); };
    document.getElementById("close").addEventListener("click", close);
    modal.addEventListener("click", (e) => { if (e.target === modal) close(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  </script>
</body>
</html>
